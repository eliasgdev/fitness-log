<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FitnessLog</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="noise"></div>

  <header>
    <div class="logo">FITNESS<span>LOG</span></div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <main>

    <!-- NAVEGACION POR TABS -->
    <div class="tabs">
      <button class="tab active" data-tab="registrar">Registrar</button>
      <button class="tab" data-tab="historial">Historial</button>
      <button class="tab" data-tab="calorias">Calorias</button>
    </div>

    <!-- TAB: REGISTRAR -->
    <section class="tab-content active" id="tab-registrar">

      <div class="form-card">
        <h2 class="section-title">Nuevo ejercicio</h2>

        <!-- Selector de tipo -->
        <div class="form-group">
          <label>Tipo de entrenamiento</label>
          <div class="tipo-btns">
            <button class="tipo-btn active" data-tipo="pesas">Pesas</button>
            <button class="tipo-btn" data-tipo="cardio">Cardio</button>
            <button class="tipo-btn" data-tipo="calistenia">Calistenia</button>
          </div>
        </div>

        <!-- Nombre del ejercicio -->
        <div class="form-group">
          <label for="ejercicioNombre">Nombre del ejercicio</label>
          <input type="text" id="ejercicioNombre" placeholder="Ej: Sentadilla, Press banca, Correr..."/>
        </div>

        <!-- Campos para pesas -->
        <div class="form-row" id="rowPesas">
          <div class="form-group">
            <label for="series">Series</label>
            <input type="number" id="series" placeholder="3" min="1"/>
          </div>
          <div class="form-group">
            <label for="reps">Repeticiones</label>
            <input type="number" id="reps" placeholder="12" min="1"/>
          </div>
          <div class="form-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" placeholder="60" min="0"/>
          </div>
        </div>

        <!-- Campos para cardio -->
        <div class="form-row hidden" id="rowCardio">
          <div class="form-group">
            <label for="duracion">Duracion (min)</label>
            <input type="number" id="duracion" placeholder="30" min="1"/>
          </div>
          <div class="form-group">
            <label for="distancia">Distancia (km)</label>
            <input type="number" id="distancia" placeholder="5" min="0" step="0.1"/>
          </div>
        </div>

        <!-- Campos para calistenia -->
        <div class="form-row hidden" id="rowCalistenia">
          <div class="form-group">
            <label for="seriesC">Series</label>
            <input type="number" id="seriesC" placeholder="4" min="1"/>
          </div>
          <div class="form-group">
            <label for="repsC">Repeticiones</label>
            <input type="number" id="repsC" placeholder="15" min="1"/>
          </div>
        </div>

        <!-- Notas opcionales -->
        <div class="form-group">
          <label for="notas">Notas (opcional)</label>
          <input type="text" id="notas" placeholder="Ej: Aumente peso, me costo el ultimo set..."/>
        </div>

        <button class="btn-primary" id="btnGuardar">GUARDAR EJERCICIO</button>
        <p class="feedback-msg" id="feedbackMsg"></p>
      </div>

      <!-- Resumen del dia actual -->
      <div class="dia-resumen">
        <h3 class="section-title">Hoy — <span id="resumenCount">0</span> ejercicios</h3>
        <div id="ejerciciosHoy"></div>
      </div>

    </section>

    <!-- TAB: HISTORIAL -->
    <section class="tab-content hidden" id="tab-historial">
      <h2 class="section-title">Historial de entrenamientos</h2>
      <div id="historialLista"></div>
    </section>

    <!-- TAB: CALORIAS -->
    <section class="tab-content hidden" id="tab-calorias">
      <h2 class="section-title">Calorias de hoy</h2>

      <div class="cal-total-card">
        <div class="cal-numero" id="calTotal">0</div>
        <div class="cal-label">kcal quemadas estimadas</div>
      </div>

      <div class="macros-grid">
        <div class="macro-card">
          <span class="macro-val" id="macroCardio">0</span>
          <span class="macro-label">Cardio (kcal)</span>
        </div>
        <div class="macro-card">
          <span class="macro-val" id="macroPesas">0</span>
          <span class="macro-label">Pesas (kcal)</span>
        </div>
        <div class="macro-card">
          <span class="macro-val" id="macroCalistenia">0</span>
          <span class="macro-label">Calistenia (kcal)</span>
        </div>
      </div>

      <div class="cal-info">
        <p>Estimacion basada en promedios generales. Los valores reales varian segun tu peso y nivel de intensidad.</p>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
